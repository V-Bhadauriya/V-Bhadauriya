query User($login: String!, $from: DateTime!, $to: DateTime!) {
  user(login: $login) {
    id
    login
    name
    createdAt
    contributionsCollection(from: $from, to: $to) {
      commitContributionsByRepository(maxRepositories: 100) {
        repository {
          nameWithOwner
        }
      }
      contributionCalendar {
        weeks {
          contributionDays {
            date
            contributionCount
          }
        }
      }
    }
  }
  rateLimit {
    remaining
    resetAt
  }
}
