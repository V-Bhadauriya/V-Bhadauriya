name: refresh-profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pulse/**"
      - "profile.yml"
      - "requirements.lock"
      - ".github/workflows/refresh.yml"

permissions: {}

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  # Holds the PAT, but can't write to the repo.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install (hash-locked)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Scrape GitHub and render panels
        env:
          # Read-only PAT for private aggregates; without it only public data is used.
          PULSE_TOKEN: ${{ secrets.PULSE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pulse --out assets --readme README.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered
          path: |
            assets/
            README.md
          retention-days: 1
          if-no-files-found: error

  # Can write to the repo, but never sees the PAT.
  commit:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendered
          path: ${{ runner.temp }}/rendered

      - name: Commit if changed
        env:
          RENDERED: ${{ runner.temp }}/rendered
          RENDER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          allowed='^(README\.md|assets/(status|activity|toolchain|slo|timeseries|heatmap|trace|resources|pods)-(dark|light)\.svg)$'
          # Generated files are never merged: start from the latest main each attempt and
          # lay the fresh render on top, so concurrent pushes can't cause conflicts.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RENDERED"/assets/*.svg assets/
            # Only take the rendered README if nobody edited README since this render began.
            if git diff --quiet "$RENDER_SHA" origin/main -- README.md; then
              cp "$RENDERED/README.md" README.md
            fi
            git add -A assets README.md
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi
            if git diff --cached --name-only | grep -Ev "$allowed"; then
              echo "::error::Unexpected file staged; refusing to commit."
              exit 1
            fi
            git commit -q -m "chore: refresh profile telemetry"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update (attempt $attempt); retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
