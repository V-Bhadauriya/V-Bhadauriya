 y="112" class="md mut" text-anchor="end">105d</text></g><g class="rise" style="animation-delay:0.40s"><circle cx="21" cy="134" r="4" fill="#ff5d6c" class="ping"/><circle cx="21" cy="134" r="4" fill="#ff5d6c"/><rect x="30" y="124" width="84" height="18" rx="9" fill="#ff5d6c" fill-opacity="0.15" stroke="#ff5d6c" stroke-opacity="0.6"/><text x="72" y="138" class="sm" fill="#ff5d6c" font-weight="700" text-anchor="middle">CRITICAL</text><text x="130" y="138" class="md acc">niriksha-sdk-java</text><text x="410" y="138" class="md">fix(security): clear every OWASP dependency-check…</text><text x="844" y="138" class="md mut" text-anchor="end">67d</text></g><g class="rise" style="animation-delay:0.50s"><circle cx="21" cy="160" r="4" fill="#ff5d6c" class="ping"/><circle cx="21" cy="160" r="4" fill="#ff5d6c"/><rect x="30" y="150" width="84" height="18" rx="9" fill="#ff5d6c" fill-opacity="0.15" stroke="#ff5d6c" stroke-opacity="0.6"/><text x="72" y="164" class="sm" fill="#ff5d6c" font-weight="700" text-anchor="middle">CRITICAL</text><text x="130" y="164" class="md acc">niriksha-sdk-java</text><text x="410" y="164" class="md">ci: fix the OWASP job's NVD crash and 6-hour time…</text><text x="844" y="164" class="md mut" text-anchor="end">66d</text></g><g class="rise" style="animation-delay:0.60s"><circle cx="21" cy="186" r="4" fill="#ff5d6c" class="ping"/><circle cx="21" cy="186" r="4" fill="#ff5d6c"/><rect x="30" y="176" width="84" height="18" rx="9" fill="#ff5d6c" fill-opacity="0.15" stroke="#ff5d6c" stroke-opacity="0.6"/><text x="72" y="190" class="sm" fill="#ff5d6c" font-weight="700" text-anchor="middle">CRITICAL</text><text x="130" y="190" class="md acc">private · Rust service</text><text x="410" y="190" class="md">pull request awaiting merge</text><text x="844" y="190" class="md mut" text-anchor="end">50d</text></g><text x="16" y="230" class="sm mut">+4 more firing</text></svg>