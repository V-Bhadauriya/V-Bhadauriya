<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Weekly code churn, lines added versus removed"><title>Weekly code churn, lines added versus removed</title><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#d6e2ee;}
.mut{fill:#6e7f91;} .acc{fill:#38e1c6;} .acc2{fill:#8b7cf6;}
.ok{fill:#3fd07f;} .warn{fill:#f2b134;} .crit{fill:#ff5d6c;}
