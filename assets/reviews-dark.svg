<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-label="Code review activity"><title>Code review activity</title><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#d6e2ee;}
.mut{fill:#6e7f91;} .acc{fill:#38e1c6;} .acc2{fill:#8b7cf6;}
.ok{fill:#3fd07f;} .warn{fill:#f2b134;} .crit{fill:#ff5d6c;}
.s-acc{stroke:#38e1c6;} .s-grid{stroke:#18212b;} .s-mut{stroke:#6e7f91;}
.ttl{font-size:11px;letter-spacing:.14em;font-weight:700;}
.sm{font-size:10px;} .md{font-size:12px;} .lg{font-size:20px;font-weight:700;}
.xl{font-size:28px;font-weight:800;letter-spacing:-.01em;}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes ping{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@keyframes blink{50%{opacity:0}}
@keyframes glow{50%{opacity:.35}}
.fade{animation:fade .9s ease-out both;}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.4s cubic-bezier(.6,.1,.2,1) both;}
.growx{transform-box:fill-box;transform-origin:left center;
  animation:growx .9s cubic-bezier(.2,.7,.2,1) both;}
.growy{transform-box:fill-box;transform-origin:center bottom;
  animation:growy .8s cubic-bezier(.2,.7,.2,1) both;}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite;}
.blink{animation:blink 1.1s steps(1) infinite;}
.glow{animation:glow 2.6s ease-in-out infinite;}

@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style><g><defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#18212b"/></pattern></defs><rect x="0.5" y="0.5" width="859" height="199" rx="10" fill="#0f141b" stroke="#1e2732"/><rect x="1" y="34" width="858" height="165" fill="url(#dots)" opacity="0.9"/><line x1="1" y1="34" x2="859" y2="34" stroke="#1e2732"/><rect x="16" y="13" width="8" height="8" rx="2" fill="#38e1c6"/><text x="32" y="21" class="ttl">CODE REVIEW · PEER APPROVALS</text><text x="844" y="21" class="sm mut" text-anchor="end">last 26 weeks</text></g><g class="rise" style="animation-delay:0.10s"><rect x="16" y="50" width="201" height="58" rx="8" fill="#0a0e14" stroke="#1e2732" fill-opacity="0.55"/><rect x="16" y="62" width="2" height="34" fill="#38e1c6"/><text x="28" y="67" class="sm mut" letter-spacing="0.1em">REVIEWS GIVEN</text><text x="28" y="89" font-size="18" font-weight="700">0</text><text x="28" y="101" class="mut" font-size="8.5">PRs by others · 365d</text></g><g class="rise" style="animation-delay:0.18s"><rect x="225" y="50" width="201" height="58" rx="8" fill="#0a0e14" stroke="#1e2732" fill-opacity="0.55"/><rect x="225" y="62" width="2" height="34" fill="#8b7cf6"/><text x="237" y="67" class="sm mut" letter-spacing="0.1em">FIRST RESPONSE</text><text x="237" y="89" font-size="18" font-weight="700">n/a</text><text x="237" y="101" class="mut" font-size="8.5">p50 · PR open → your review</text></g><g class="rise" style="animation-delay:0.26s"><rect x="434" y="50" width="201" height="58" rx="8" fill="#0a0e14" stroke="#1e2732" fill-opacity="0.55"/><rect x="434" y="62" width="2" height="34" fill="#38e1c6"/><text x="446" y="67" class="sm mut" letter-spacing="0.1em">SLOW TAIL</text><text x="446" y="89" font-size="18" font-weight="700">n/a</text><text x="446" y="101" class="mut" font-size="8.5">p90 response time</text></g><g class="rise" style="animation-delay:0.34s"><rect x="643" y="50" width="201" height="58" rx="8" fill="#0a0e14" stroke="#1e2732" fill-opacity="0.55"/><rect x="643" y="62" width="2" height="34" fill="#8b7cf6"/><text x="655" y="67" class="sm mut" letter-spacing="0.1em">REPOS REVIEWED</text><text x="655" y="89" font-size="18" font-weight="700">0</text><text x="655" y="101" class="mut" font-size="8.5">distinct services</text></g><text x="430" y="155" class="sm mut" text-anchor="middle">no reviews recorded in this window</text></svg>